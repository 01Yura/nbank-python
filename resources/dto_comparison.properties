# Format:
# RequestModelClass=ResponseModelClass:tokens
#
# tokens are comma-separated and may be:
# - "*"                     -> compare all common fields (request fields that exist in response)
# - "!field"                -> ignore request field in "*" mode
# - "field"                 -> compare request.field with response.field
# - "requestPath=responsePath" -> compare nested paths (e.g. "account.id=accountId" or "accounts[0].id=accounts[0].id")

CreateUserRequestDTO=CreateUserResponseDTO:*,!password
UpdateProfileRequestDTO=UpdateProfileResponseDTO:name=customer.name
DepositMoneyRequestDTO=DepositMoneyResponseDTO:id
AccountDTO=AccountDTO:*